name: Support
description: Help using Studio, lessons, or the site
title: "[Support]: "
labels: ["support"]
body:
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      placeholder: What you tried, where you are (Studio / lesson / example), what you expected.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link (optional)
      placeholder: https://www.loomrume.com/studio
